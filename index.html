<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passwords</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1d1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Passwords">
<style>
  :root {
    --bg:        #f2f1ee;
    --surface:   #ffffff;
    --surface2:  #e8e6e1;
    --border:    #d0cdc7;
    --text:      #1a1917;
    --muted:     #6b6860;
    --accent:    #2a5caa;
    --accent2:   #1a3d72;
    --reveal:    #b85c00;
    --reveal2:   #8a4400;
    --note:      #2a7a4f;
    --note2:     #1a5235;
    --add:       #555250;
    --add2:      #333130;
    --danger:    #c0392b;
    --shadow:    0 2px 8px rgba(0,0,0,0.08);
    --radius:    12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #111110;
      --surface:  #1e1d1b;
      --surface2: #2a2926;
      --border:   #3a3835;
      --text:     #f0ede8;
      --muted:    #8a8780;
      --accent:   #5b8dd9;
      --accent2:  #4070bb;
      --reveal:   #e07a30;
      --reveal2:  #c06020;
      --note:     #4aaa74;
      --note2:    #2a7a4f;
      --add:      #888580;
      --add2:     #666360;
      --danger:   #e05545;
      --shadow:   0 2px 10px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px 0;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }

  header h1 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .search-wrap {
    position: relative;
  }

  #search {
    width: 100%;
    padding: 11px 16px 11px 42px;
    font-size: 16px;
    font-family: inherit;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
  }

  #clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    display: none;
    line-height: 1;
  }

  .suggestions {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 200;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }

  .suggestion-item {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 15px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:active, .suggestion-item:hover { background: var(--surface2); }

  .suggestion-item mark {
    background: none;
    color: var(--accent);
    font-weight: bold;
  }

  /* Result card */
  #result-card {
    margin: 16px 16px 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: none;
  }

  .card-header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .card-org {
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 0.01em;
    flex: 1;
  }

  .card-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: 5px 10px;
    font-size: 14px;
    cursor: pointer;
    color: var(--muted);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    line-height: 1.3;
  }

  .icon-btn:active { transform: scale(0.93); }

  .icon-btn.edit:hover  { background: var(--accent); color: #fff; border-color: var(--accent); }
  .icon-btn.delete:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* Confirm dialog overlay */
  #confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }

  #confirm-overlay.show { display: flex; }

  .confirm-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 22px 18px;
    max-width: 300px;
    width: 90%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    text-align: center;
  }

  .confirm-box p {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 20px;
    color: var(--text);
  }

  .confirm-box strong { color: var(--danger); }

  .confirm-btns {
    display: flex;
    gap: 10px;
  }

  .confirm-btns button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-cancel-confirm { background: var(--surface2); color: var(--text); }
  .btn-cancel-confirm:hover { background: var(--border); }
  .btn-delete-confirm { background: var(--danger); color: #fff; }
  .btn-delete-confirm:hover { filter: brightness(0.88); }

  .card-body {
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .info-row {
    display: none;
    background: var(--surface2);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 15px;
    word-break: break-all;
    line-height: 1.5;
  }

  .info-row.visible { display: block; }

  .info-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .info-value {
    font-size: 16px;
    font-family: 'Courier New', monospace;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 18px 16px;
  }

  .action-btn {
    flex: 1;
    min-width: 0;
    padding: 11px 8px;
    border: none;
    border-radius: 9px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    color: #fff;
    text-align: center;
  }

  .action-btn:active { transform: scale(0.96); }

  .btn-password { background: var(--reveal); }
  .btn-password:hover { background: var(--reveal2); }
  .btn-password.active { background: var(--reveal2); }

  .btn-email { background: var(--accent); }
  .btn-email:hover { background: var(--accent2); }
  .btn-email.active { background: var(--accent2); }

  .btn-notes { background: var(--note); }
  .btn-notes:hover { background: var(--note2); }
  .btn-notes.active { background: var(--note2); }

  /* No match / Add new */
  #no-match {
    margin: 16px 16px 0;
    display: none;
    text-align: center;
  }

  #no-match p {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 14px;
  }

  #no-match strong { color: var(--text); }

  /* Add form */
  #add-form {
    margin: 16px 16px 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: none;
  }

  .form-header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .form-title {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.04em;
  }

  .form-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }

  .form-body {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .form-field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .form-field input, .form-field textarea {
    width: 100%;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .form-field textarea {
    resize: vertical;
    min-height: 70px;
  }

  .form-field input:focus,
  .form-field textarea:focus { border-color: var(--accent); }

  .form-actions {
    display: flex;
    gap: 8px;
    padding: 0 18px 18px;
  }

  .btn-save {
    flex: 1;
    padding: 13px;
    background: var(--add);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-save:hover { background: var(--add2); }
  .btn-save:active { transform: scale(0.97); }

  /* Floating buttons */
  #fab {
    position: fixed;
    bottom: 22px;
    right: 20px;
    z-index: 300;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--add);
    color: #fff;
    border: none;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.15s;
  }

  #fab:active { transform: scale(0.92); background: var(--add2); }

  #fab-export {
    position: fixed;
    bottom: 22px;
    left: 20px;
    z-index: 300;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.15s;
  }

  #fab-export:active { transform: scale(0.92); background: var(--accent2); }
  #fab-import {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 300;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #2a7a2a;
    color: #fff;
    border: none;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #fab-import:active { opacity: 0.8; }


  /* Toast */
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 9px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
  }

  /* PIN lock screen */
  #pin-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 40px 24px;
  }

  #pin-screen h2 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  #pin-screen .pin-icon {
    font-size: 40px;
    margin-bottom: 20px;
  }

  .pin-subtitle {
    display: none;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 18px 0;
    padding: 0 20px;
    line-height: 1.5;
    max-width: 340px;
  }

  #pin-confirm { display: none; }

  .pin-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 260px;
  }

  .pin-form input {
    width: 100%;
    padding: 13px 18px;
    font-size: 22px;
    font-family: 'Courier New', monospace;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    outline: none;
    text-align: center;
    letter-spacing: 0.3em;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .pin-form input:focus { border-color: var(--accent); }

  .pin-form button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .pin-form button:active { opacity: 0.8; }

  .pin-error {
    font-size: 12px;
    color: #c0392b;
    min-height: 18px;
    text-align: center;
  }

  #app-content { display: none; }
</style>
</head>
<body>

<style>
  .pin-alt { margin-top: 14px; font-size: 0.85rem; text-align: center; }
  .pin-alt a { color: inherit; opacity: 0.75; text-decoration: underline; cursor: pointer; }
  .pin-alt a:hover { opacity: 1; }
  .pin-busy { margin-top: 12px; font-size: 0.85rem; opacity: 0.75; text-align: center; }
  #lock-btn {
    position: fixed; top: 14px; right: 14px; z-index: 150;
    border: none; border-radius: 999px; cursor: pointer;
    background: rgba(0,0,0,0.28); color: #fff;
    font-size: 0.78rem; padding: 7px 13px; line-height: 1;
  }
  #lock-btn:active { opacity: 0.75; }
  #entry-count {
    font-size: 0.78rem; opacity: 0.6; margin: 2px 0 12px;
    letter-spacing: 0.02em;
  }
</style>

<div id="pin-screen" style="display: flex;">
  <div class="pin-icon">🔑</div>
  <h2 id="pin-title">Passwords</h2>
  <p id="pin-subtitle" class="pin-subtitle"></p>
  <div class="pin-form">
    <input type="password" id="pin-input" placeholder="Passphrase" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input type="password" id="pin-confirm" placeholder="Confirm passphrase" autocomplete="off" autocapitalize="off" spellcheck="false" style="display:none">
    <div class="pin-error" id="pin-error"></div>
    <button id="pin-button" onclick="submitPin()">Unlock</button>
    <div class="pin-alt" id="pin-alt" style="display:none"></div>
  </div>
</div>

<div id="app-content" style="display: none;">
<button id="lock-btn" onclick="lockVault()" title="Lock the vault">🔒 Lock</button>

<header>
  <h1>🔑 Passwords</h1>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
    <div id="entry-count"></div>
    <span id="sync-pill" onclick="openSyncSettings()" title="Sync status" style="cursor:pointer;font-size:11px;letter-spacing:0.06em;padding:3px 9px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);">☁ Sync</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Type a company name…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="clear-btn" onclick="clearSearch()" style="display: block;">✕</button>
    <div class="suggestions" id="suggestions" style="display: none;"></div>
  </div>
</header>

<div id="result-card" style="display: none;">
  <div class="card-header">
    <div class="card-org" id="card-org"></div>
    <div class="card-actions">
      <button class="icon-btn edit" onclick="editCurrentEntry()" title="Edit">✎ Edit</button>
      <button class="icon-btn delete" onclick="confirmDelete()" title="Delete">🗑</button>
    </div>
  </div>
  <div class="card-body">
    <div class="info-row" id="row-password">
      <div class="info-label">Password</div>
      <div class="info-value" id="val-password"></div>
    </div>
    <div class="info-row" id="row-email">
      <div class="info-label">Email Address</div>
      <div class="info-value" id="val-email"></div>
    </div>
    <div class="info-row" id="row-notes">
      <div class="info-label">Notes</div>
      <div class="info-value" id="val-notes"></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="action-btn btn-password active" onclick="toggleField('password')">👁 Password</button>
    <button class="action-btn btn-email active" onclick="toggleField('email')">✉ Email</button>
    <button class="action-btn btn-notes active" onclick="toggleField('notes')">📋 Notes</button>
  </div>
</div>

<div id="no-match" style="display: none;">
  <p>No entry found for <strong id="no-match-term"></strong></p>
  <button class="btn-save" style="max-width:200px;margin:0 auto;display:block;" onclick="showAddForm(true)">+ Add New Entry</button>
</div>

<div id="add-form" style="display: none;">
  <div class="form-header">
    <div class="form-title" id="form-title">New Entry</div>
    <button class="form-close" onclick="hideAddForm()">✕</button>
  </div>
  <div class="form-body">
    <div class="form-field">
      <label>Organisation / Website</label>
      <input type="text" id="f-org" placeholder="e.g. Amazon" autocorrect="off">
    </div>
    <div class="form-field">
      <label>Email Address</label>
      <input type="email" id="f-email" placeholder="your@email.com">
    </div>
    <div class="form-field">
      <label>Password</label>
      <input type="text" id="f-password" placeholder="password or code" autocorrect="off" autocomplete="off">
    </div>
    <div class="form-field">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Any additional info…"></textarea>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn-save" onclick="saveEntry()">Save Entry</button>
  </div>
</div>

<div class="empty-state" id="empty-state" style="display: none;">
  Start typing a company or website name above
</div>

<div id="confirm-overlay">
  <div class="confirm-box">
    <p>Delete <strong id="confirm-org-name"></strong>?<br>This cannot be undone.</p>
    <div class="confirm-btns">
      <button class="btn-cancel-confirm" onclick="hideConfirm()">Cancel</button>
      <button class="btn-delete-confirm" onclick="deleteCurrentEntry()">Delete</button>
    </div>
  </div>
</div>

<button id="fab-export" onclick="exportFile()" title="Export data as JSON">💾</button>
<button id="fab-import" onclick="importFile()" title="Import JSON backup">📥</button>
<button id="fab" onclick="showAddForm(false)" title="Add new entry">+</button>
<div id="toast"></div>

<!-- Sync settings modal -->
<div id="sync-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:600;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--surface);border:1.5px solid var(--border);border-radius:12px;width:100%;max-width:340px;overflow:hidden;">
    <div style="background:var(--surface2);padding:14px 18px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:15px;font-weight:bold;letter-spacing:0.04em;">Cloud Sync</span>
      <button onclick="closeSyncSettings()" style="background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px;">✕</button>
    </div>
    <div style="padding:16px 18px;display:flex;flex-direction:column;gap:12px;">
      <div>
        <label style="display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;">Worker URL</label>
        <input type="url" id="sync-url" placeholder="https://crapps-sync.workers.dev" style="width:100%;padding:9px 12px;font-size:14px;font-family:inherit;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);outline:none;">
      </div>
      <div>
        <label style="display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;">Username</label>
        <input type="text" id="sync-user" placeholder="clive" autocomplete="off" autocorrect="off" autocapitalize="off" style="width:100%;padding:9px 12px;font-size:14px;font-family:inherit;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);outline:none;">
      </div>
      <div>
        <label style="display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;">Token</label>
        <input type="password" id="sync-token" placeholder="your-sync-token" autocomplete="off" style="width:100%;padding:9px 12px;font-size:14px;font-family:inherit;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);outline:none;">
      </div>
      <div id="sync-status-msg" style="font-size:12px;color:var(--muted);min-height:16px;"></div>
      <div style="display:flex;gap:8px;">
        <button onclick="saveSync()" style="flex:1;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-family:inherit;letter-spacing:0.06em;cursor:pointer;">Connect</button>
        <button onclick="syncNow()" id="sync-now-btn" style="flex:1;padding:11px;background:var(--surface2);color:var(--text);border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;letter-spacing:0.06em;cursor:pointer;">Sync now</button>
      </div>
      <button onclick="disconnectSync()" style="padding:9px;background:none;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer;letter-spacing:0.06em;">Disconnect</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
// Paste your full dataset here. Each entry: { org, email, password, notes }
// Entries are kept in localStorage so new additions persist across sessions.

// ── STORAGE ───────────────────────────────────────────────────────────────────
// The vault is held on disk only as an AES-GCM ciphertext. The key is derived
// from the passphrase at unlock and lives in memory alone — it is never written
// to localStorage or sessionStorage in usable form.

const LEGACY_KEY  = 'pw_entries_20260611';   // old plaintext store, migrated then deleted
const LEGACY_PIN  = 'pw_pin_hash';           // old PIN gate, no longer used
const VAULT_KEY   = 'pw_vault_v2';           // encrypted envelope
const SESSION_KEY = 'pw_session_v2';         // PIN-wrapped key, session lifetime only
const AUTOLOCK_MS = 5 * 60 * 1000;

const KDF_ITERATIONS = 600000;   // PBKDF2-SHA256; stored in the envelope so it can change

let data = [];            // decrypted entries, in memory only while unlocked
let vaultKey = null;      // CryptoKey, in memory only while unlocked
let currentEntry = null;

const b64 = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))),
  dec: (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0)),
};

async function deriveKey(passphrase, salt, iterations) {
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    true,                       // extractable, so a session PIN can wrap it
    ['encrypt', 'decrypt']
  );
}

async function encryptVault(entries, key, salt, iterations) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const pt = new TextEncoder().encode(JSON.stringify(entries));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, pt);
  return {
    v: 2,
    kdf: 'PBKDF2-SHA256',
    iterations,
    salt: b64.enc(salt),
    iv: b64.enc(iv),
    ct: b64.enc(ct),
  };
}

/** Throws if the passphrase is wrong — AES-GCM's tag check does the work. */
async function decryptVault(envelope, key) {
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64.dec(envelope.iv) }, key, b64.dec(envelope.ct)
  );
  return JSON.parse(new TextDecoder().decode(pt));
}

function readEnvelope() {
  try { return JSON.parse(localStorage.getItem(VAULT_KEY) || 'null'); }
  catch (e) { return null; }
}

/** Give every entry a stable id and a modification time. */
function normaliseEntries(entries) {
  const now = Date.now();
  return (Array.isArray(entries) ? entries : []).map(e => ({
    id: e.id || (crypto.randomUUID ? crypto.randomUUID()
                                   : 'e' + Math.random().toString(36).slice(2, 12)),
    org: e.org || '',
    email: e.email || '',
    password: e.password || '',
    notes: e.notes || '',
    updated: e.updated || now,
  }));
}

/** Re-encrypt and persist. Called after every change. */
async function saveData(entries) {
  // Callers treat this as fire-and-forget, so it must never reject: a silent
  // failure here would look exactly like a successful save.
  if (!vaultKey) { showToast('Vault is locked — not saved'); return false; }
  try {
    const env = readEnvelope();
    const salt = env ? b64.dec(env.salt) : crypto.getRandomValues(new Uint8Array(16));
    const iterations = (env && env.iterations) || KDF_ITERATIONS;
    const fresh = await encryptVault(entries, vaultKey, salt, iterations);
    localStorage.setItem(VAULT_KEY, JSON.stringify(fresh));
    // Auto-push to cloud if sync is configured
    const _ss = getSyncSettings();
    if (_ss) setTimeout(() => pushVault(_ss).catch(() => {}), 500);
    return true;
  } catch (e) {
    showToast('NOT SAVED: ' + (e.message || e));
    return false;
  }
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
const searchEl   = document.getElementById('search');
const suggestEl  = document.getElementById('suggestions');
const clearBtn   = document.getElementById('clear-btn');
const resultCard = document.getElementById('result-card');
const noMatch    = document.getElementById('no-match');
const addForm    = document.getElementById('add-form');
const emptyState = document.getElementById('empty-state');

searchEl.addEventListener('input', onSearchInput);
searchEl.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) hideSuggestions();
});

function onSearchInput() {
  const q = searchEl.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';
  hideResult();
  hideAddForm();

  if (!q) {
    hideSuggestions();
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  const matches = data.filter(d => d.org.toLowerCase().startsWith(q.toLowerCase()));

  if (matches.length === 0) {
    hideSuggestions();
    showNoMatch(q);
    return;
  }

  noMatch.style.display = 'none';
  renderSuggestions(matches, q);
}

function renderSuggestions(matches, q) {
  suggestEl.innerHTML = '';
  matches.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'suggestion-item';
    const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    div.innerHTML = entry.org.replace(re, '<mark>$1</mark>');
    div.addEventListener('click', () => selectEntry(entry));
    suggestEl.appendChild(div);
  });
  suggestEl.style.display = 'block';
}

function hideSuggestions() {
  suggestEl.style.display = 'none';
}

function selectEntry(entry) {
  currentEntry = entry;
  searchEl.value = entry.org;
  clearBtn.style.display = 'block';
  hideSuggestions();
  noMatch.style.display = 'none';
  emptyState.style.display = 'none';
  showCard(entry);
}

function clearSearch() {
  searchEl.value = '';
  clearBtn.style.display = 'none';
  hideSuggestions();
  hideResult();
  hideAddForm();
  noMatch.style.display = 'none';
  emptyState.style.display = 'block';
  currentEntry = null;
  searchEl.focus();
}

// ── CARD ──────────────────────────────────────────────────────────────────────
function showCard(entry) {
  document.getElementById('card-org').textContent = entry.org;
  document.getElementById('val-password').textContent = entry.password || '(none set)';
  document.getElementById('val-email').textContent = entry.email || '(none set)';
  document.getElementById('val-notes').textContent = entry.notes || '(none)';

  // Reset all rows hidden
  ['password','email','notes'].forEach(f => {
    document.getElementById('row-' + f).classList.remove('visible');
    document.querySelector('.btn-' + f).classList.remove('active');
  });

  resultCard.style.display = 'block';
}

function hideResult() {
  resultCard.style.display = 'none';
}

function toggleField(field) {
  const row = document.getElementById('row-' + field);
  const btn = document.querySelector('.btn-' + field);
  const isVisible = row.classList.contains('visible');
  row.classList.toggle('visible', !isVisible);
  btn.classList.toggle('active', !isVisible);
}

// ── NO MATCH ──────────────────────────────────────────────────────────────────
function showNoMatch(q) {
  document.getElementById('no-match-term').textContent = '"' + q + '"';
  noMatch.style.display = 'block';
}

// ── ADD / EDIT FORM ───────────────────────────────────────────────────────────
let editMode = false; // true when editing an existing entry

function showAddForm(prefill) {
  editMode = false;
  document.getElementById('form-title').textContent = 'New Entry';
  addForm.style.display = 'block';
  hideResult();
  noMatch.style.display = 'none';
  emptyState.style.display = 'none';

  document.getElementById('f-org').value = prefill ? searchEl.value.trim() : '';
  document.getElementById('f-email').value = '';
  document.getElementById('f-password').value = '';
  document.getElementById('f-notes').value = '';

  setTimeout(() => document.getElementById('f-org').focus(), 100);
}

function editCurrentEntry() {
  if (!currentEntry) return;
  editMode = true;
  document.getElementById('form-title').textContent = 'Edit Entry';
  addForm.style.display = 'block';
  hideResult();
  emptyState.style.display = 'none';

  document.getElementById('f-org').value = currentEntry.org;
  document.getElementById('f-email').value = currentEntry.email || '';
  document.getElementById('f-password').value = currentEntry.password || '';
  document.getElementById('f-notes').value = currentEntry.notes || '';

  setTimeout(() => document.getElementById('f-password').focus(), 100);
}

function hideAddForm() {
  addForm.style.display = 'none';
  editMode = false;
}

function saveEntry() {
  const org = document.getElementById('f-org').value.trim();
  if (!org) { showToast('Please enter an organisation name'); return; }

  const existing = data.find(d => d.org.toLowerCase() === org.toLowerCase());
  const entry = {
    id: (existing && existing.id) || (currentEntry && currentEntry.id) ||
        (crypto.randomUUID ? crypto.randomUUID() : 'e' + Math.random().toString(36).slice(2, 12)),
    org,
    email:    document.getElementById('f-email').value.trim(),
    password: document.getElementById('f-password').value.trim(),
    notes:    document.getElementById('f-notes').value.trim(),
    updated:  Date.now()
  };

  const idx = data.findIndex(d => d.org.toLowerCase() === org.toLowerCase());
  if (idx >= 0) {
    data[idx] = entry;
    showToast('Updated: ' + org);
  } else {
    const insertAt = data.findIndex(d => d.org.toLowerCase() > org.toLowerCase());
    if (insertAt === -1) data.push(entry);
    else data.splice(insertAt, 0, entry);
    showToast('Saved: ' + org);
  }

  saveData(data);
  renderCount();
  hideAddForm();
  searchEl.value = org;
  clearBtn.style.display = 'block';
  currentEntry = entry;
  showCard(entry);
}

// ── DELETE ────────────────────────────────────────────────────────────────────
function confirmDelete() {
  if (!currentEntry) return;
  document.getElementById('confirm-org-name').textContent = currentEntry.org;
  document.getElementById('confirm-overlay').classList.add('show');
}

function hideConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
}

function deleteCurrentEntry() {
  if (!currentEntry) return;
  const org = currentEntry.org;
  data = data.filter(d => d.org !== currentEntry.org);
  saveData(data);
  renderCount();
  hideConfirm();
  clearSearch();
  showToast('Deleted: ' + org);
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
// Reads the current HTML file, splices in the live data, and downloads it.
// The exported file is a complete standalone copy with all edits baked in.
function exportFile() {
  // The export is deliberately plain JSON: it is the recovery path if the
  // passphrase is ever forgotten. That makes the file itself unprotected.
  if (!confirm(
    'This backup is NOT encrypted — anyone who opens the file can read every entry.\n\n' +
    'It is your only way back in if you forget your passphrase, so keep it, but keep it somewhere safe.\n\n' +
    'Continue?'
  )) return;
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'passwords-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported — save to Google Drive');
}

function importFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported)) throw new Error('Invalid format');
        data = normaliseEntries(imported);
        saveData(data);
        renderCount();
        searchEl.value = '';
        clearSearch();
        showToast('Imported ' + data.length + ' entries — search to find them');
      } catch(err) {
        alert('Import failed: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
// ── UNLOCK ────────────────────────────────────────────────────────────────────
// Three ways in:
//   1. First run / migration  — choose a passphrase, vault is created or converted
//   2. Passphrase             — derives the key, decrypts the vault
//   3. Session PIN            — unwraps a key already unlocked earlier this session
//
// The session PIN is convenience, not a second lock. It only exists while the
// browser session does, and a short PIN cannot resist an offline attack. The
// passphrase is what actually protects the data at rest.

const PIN_MAX_TRIES = 3;
let pinTries = 0;
let lockMode = 'passphrase';   // 'create' | 'passphrase' | 'pin' | 'setpin'
let pendingKey = null;         // used between unlock and offering a session PIN
let autolockTimer = null;

const el = (id) => document.getElementById(id);

function legacyEntries() {
  try {
    const raw = localStorage.getItem(LEGACY_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) && parsed.length ? parsed : null;
  } catch (e) { return null; }
}

function setLockMode(mode, message) {
  lockMode = mode;
  const title = el('pin-title'), sub = el('pin-subtitle'), input = el('pin-input'),
        confirm = el('pin-confirm'), button = el('pin-button'), alt = el('pin-alt');

  el('pin-error').textContent = '';
  input.value = ''; confirm.value = '';
  confirm.style.display = 'none';
  alt.style.display = 'none';
  alt.innerHTML = '';

  if (mode === 'create') {
    const legacy = legacyEntries();
    title.textContent = legacy ? 'Encrypt your vault' : 'Create a passphrase';
    sub.innerHTML = legacy
      ? 'Your ' + legacy.length + ' existing entries are currently stored unencrypted. ' +
        'Choose a passphrase and they will be encrypted on this device.<br><br>' +
        '<strong>If you forget it, the data cannot be recovered.</strong> Keep a JSON backup.'
      : 'Choose a passphrase to encrypt your vault.<br>' +
        'Several unrelated words work well.<br><br>' +
        '<strong>If you forget it, the data cannot be recovered.</strong>';
    sub.style.display = 'block';
    input.placeholder = 'Passphrase';
    confirm.placeholder = 'Confirm passphrase';
    confirm.style.display = 'block';
    button.textContent = 'Encrypt vault';
  }

  else if (mode === 'passphrase') {
    title.textContent = 'Passwords';
    sub.textContent = message || 'Enter your passphrase to unlock.';
    sub.style.display = 'block';
    input.placeholder = 'Passphrase';
    button.textContent = 'Unlock';
    if (sessionStorage.getItem(SESSION_KEY)) {
      alt.style.display = 'block';
      alt.innerHTML = '<a onclick="setLockMode(\'pin\')">Use session PIN instead</a>';
    }
  }

  else if (mode === 'pin') {
    title.textContent = 'Passwords';
    sub.textContent = message || 'Enter your session PIN.';
    sub.style.display = 'block';
    input.placeholder = 'PIN';
    button.textContent = 'Unlock';
    alt.style.display = 'block';
    alt.innerHTML = '<a onclick="setLockMode(\'passphrase\')">Use passphrase instead</a>';
  }

  else if (mode === 'setpin') {
    title.textContent = 'Session PIN';
    sub.innerHTML = 'Optional. Lets you get back in without retyping the passphrase, ' +
                    'until you close the browser.<br><br>' +
                    'It protects against someone picking up this device — not against ' +
                    'someone who copies its storage.';
    sub.style.display = 'block';
    input.placeholder = 'Choose a PIN (4+ digits)';
    button.textContent = 'Set PIN';
    alt.style.display = 'block';
    alt.innerHTML = '<a onclick="skipSessionPin()">Skip — ask for the passphrase every time</a>';
  }

  setTimeout(() => input.focus(), 50);
}

function busy(on, msg) {
  const button = el('pin-button');
  button.disabled = on;
  button.textContent = on ? (msg || 'Working…')
    : (lockMode === 'create' ? 'Encrypt vault' : lockMode === 'setpin' ? 'Set PIN' : 'Unlock');
}

async function submitPin() {
  const val = el('pin-input').value;
  const errEl = el('pin-error');
  errEl.textContent = '';
  if (!val) { errEl.textContent = 'Please enter something'; return; }

  // ── create the vault, or convert an existing plaintext one
  if (lockMode === 'create') {
    if (val.length < 8) { errEl.textContent = 'Use at least 8 characters'; return; }
    if (val !== el('pin-confirm').value) {
      errEl.textContent = 'The two entries do not match';
      el('pin-confirm').value = ''; el('pin-confirm').focus();
      return;
    }
    busy(true, 'Encrypting…');
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(val, salt, KDF_ITERATIONS);
      const entries = normaliseEntries(legacyEntries() || []);
      const env = await encryptVault(entries, key, salt, KDF_ITERATIONS);
      localStorage.setItem(VAULT_KEY, JSON.stringify(env));
      // Only now is it safe to drop the old plaintext copy.
      localStorage.removeItem(LEGACY_KEY);
      localStorage.removeItem(LEGACY_PIN);
      vaultKey = key; data = entries;
      pendingKey = key;
      busy(false);
      setLockMode('setpin');
    } catch (e) {
      busy(false);
      errEl.textContent = 'Could not encrypt: ' + (e.message || e);
    }
    return;
  }

  // ── unlock with the passphrase
  if (lockMode === 'passphrase') {
    const env = readEnvelope();
    if (!env) { setLockMode('create'); return; }
    busy(true, 'Unlocking…');
    try {
      const key = await deriveKey(val, b64.dec(env.salt), env.iterations || KDF_ITERATIONS);
      const entries = await decryptVault(env, key);   // throws if wrong
      vaultKey = key; data = normaliseEntries(entries);
      pendingKey = key;
      busy(false);
      if (sessionStorage.getItem(SESSION_KEY)) { unlockApp(); }
      else { setLockMode('setpin'); }
    } catch (e) {
      busy(false);
      errEl.textContent = 'Incorrect passphrase';
      el('pin-input').value = ''; el('pin-input').focus();
    }
    return;
  }

  // ── unlock with the session PIN
  if (lockMode === 'pin') {
    busy(true, 'Unlocking…');
    try {
      const wrap = JSON.parse(sessionStorage.getItem(SESSION_KEY));
      const wrapKey = await deriveKey(val, b64.dec(wrap.salt), wrap.iterations);
      const raw = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64.dec(wrap.iv) }, wrapKey, b64.dec(wrap.key)
      );
      const key = await crypto.subtle.importKey(
        'raw', raw, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
      );
      const entries = await decryptVault(readEnvelope(), key);
      vaultKey = key; data = normaliseEntries(entries);
      pinTries = 0;
      busy(false);
      unlockApp();
    } catch (e) {
      busy(false);
      pinTries++;
      if (pinTries >= PIN_MAX_TRIES) {
        sessionStorage.removeItem(SESSION_KEY);
        pinTries = 0;
        setLockMode('passphrase', 'Too many attempts. Enter your passphrase.');
      } else {
        el('pin-error').textContent = 'Incorrect PIN — ' +
          (PIN_MAX_TRIES - pinTries) + ' attempt(s) left';
        el('pin-input').value = ''; el('pin-input').focus();
      }
    }
    return;
  }

  // ── set a session PIN, wrapping the key we already hold
  if (lockMode === 'setpin') {
    if (!/^\d{4,}$/.test(val)) { errEl.textContent = 'Use at least 4 digits'; return; }
    busy(true, 'Saving…');
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const iterations = 250000;
      const wrapKey = await deriveKey(val, salt, iterations);
      const raw = await crypto.subtle.exportKey('raw', pendingKey);
      const wrapped = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, wrapKey, raw);
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        salt: b64.enc(salt), iv: b64.enc(iv), iterations, key: b64.enc(wrapped)
      }));
      busy(false);
      unlockApp();
    } catch (e) {
      busy(false);
      errEl.textContent = 'Could not set PIN: ' + (e.message || e);
    }
    return;
  }
}

function skipSessionPin() {
  sessionStorage.removeItem(SESSION_KEY);
  unlockApp();
}

function renderCount() {
  const c = document.getElementById('entry-count');
  if (!c) return;
  const n = data.length;
  c.textContent = n === 0 ? 'No entries yet'
                : n === 1 ? '1 entry'
                : n + ' entries';
}

function unlockApp() {
  pendingKey = null;
  renderCount();
  el('pin-screen').style.display = 'none';
  el('app-content').style.display = 'block';
  el('pin-input').value = '';
  el('pin-confirm').value = '';
  resetAutolock();
  // Auto-sync on unlock if configured
  const _ss = getSyncSettings();
  if (_ss) {
    setSyncPill('⚙ Sync', 'var(--muted)');
    setTimeout(() => syncNow(), 800);
  }
}

/** Drop the key and the decrypted data, and go back to the lock screen. */
function lockVault() {
  vaultKey = null;
  pendingKey = null;
  data = [];
  currentEntry = null;
  clearTimeout(autolockTimer);
  if (typeof clearSearch === 'function') { try { clearSearch(); } catch (e) {} }
  el('app-content').style.display = 'none';
  el('pin-screen').style.display = 'flex';
  setLockMode(sessionStorage.getItem(SESSION_KEY) ? 'pin' : 'passphrase');
}

function resetAutolock() {
  clearTimeout(autolockTimer);
  if (!vaultKey) return;
  autolockTimer = setTimeout(() => {
    if (vaultKey) lockVault();
  }, AUTOLOCK_MS);
}

['click', 'keydown', 'touchstart'].forEach(evt =>
  document.addEventListener(evt, () => { if (vaultKey) resetAutolock(); }, { passive: true })
);

el('pin-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (lockMode === 'create') el('pin-confirm').focus();
    else submitPin();
  }
  el('pin-error').textContent = '';
});
el('pin-confirm').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPin();
  el('pin-error').textContent = '';
});

// ── Decide which screen to show on load
(function initLock() {
  const env = readEnvelope();
  if (!env) setLockMode('create');                                  // new, or migrating
  else if (sessionStorage.getItem(SESSION_KEY)) setLockMode('pin'); // same session
  else setLockMode('passphrase');
})();

// ── CLOUD SYNC ────────────────────────────────────────────────────────────────
// Pushes/pulls the encrypted vault envelope to Cloudflare Workers KV.
// The passphrase never leaves the device — only the AES-GCM ciphertext travels.

const SYNC_SETTINGS_KEY = 'pw_sync_settings';
const SYNC_REV_KEY      = 'pw_sync_rev';
const SYNC_APP          = 'passwords';

function getSyncSettings() {
  try { return JSON.parse(localStorage.getItem(SYNC_SETTINGS_KEY)) || null; }
  catch (e) { return null; }
}

function syncEndpoint(settings) {
  return settings.url.replace(/\/$/, '') + '/v1/state?app=' + SYNC_APP;
}

function syncHeaders(settings) {
  const user = (settings.user || '').trim();
  const token = (settings.token || '').trim();
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + (user ? user + ':' + token : token),
  };
}

function setSyncPill(text, color) {
  const pill = document.getElementById('sync-pill');
  if (!pill) return;
  pill.textContent = text;
  pill.style.color = color || 'var(--muted)';
  pill.style.borderColor = color || 'var(--border)';
}

function openSyncSettings() {
  const s = getSyncSettings();
  if (s) {
    document.getElementById('sync-url').value   = s.url   || '';
    document.getElementById('sync-user').value  = s.user  || '';
    document.getElementById('sync-token').value = s.token || '';
  }
  document.getElementById('sync-status-msg').textContent = '';
  document.getElementById('sync-modal').style.display = 'flex';
}

function closeSyncSettings() {
  document.getElementById('sync-modal').style.display = 'none';
}

function saveSync() {
  const url   = document.getElementById('sync-url').value.trim();
  const user  = document.getElementById('sync-user').value.trim();
  const token = document.getElementById('sync-token').value.trim();
  if (!url || !token) {
    document.getElementById('sync-status-msg').textContent = 'URL and token are required';
    return;
  }
  localStorage.setItem(SYNC_SETTINGS_KEY, JSON.stringify({ url, user, token }));
  document.getElementById('sync-status-msg').textContent = 'Settings saved — syncing…';
  syncNow();
}

function disconnectSync() {
  localStorage.removeItem(SYNC_SETTINGS_KEY);
  localStorage.removeItem(SYNC_REV_KEY);
  const pill = document.getElementById('sync-pill');
  if (pill) pill.style.display = 'none';
  closeSyncSettings();
  showToast('Sync disconnected');
}

async function pushVault(settings) {
  const envelope = readEnvelope();
  if (!envelope) return;
  const rev = parseInt(localStorage.getItem(SYNC_REV_KEY) || '0', 10);
  const body = JSON.stringify({ data: envelope, rev });
  const res = await fetch(syncEndpoint(settings), {
    method: 'POST',
    headers: syncHeaders(settings),
    body,
  });
  if (!res.ok) throw new Error('Push failed: ' + res.status);
  const json = await res.json();
  if (json.rev) localStorage.setItem(SYNC_REV_KEY, String(json.rev));
}

async function pullVault(settings) {
  const res = await fetch(syncEndpoint(settings), { headers: syncHeaders(settings) });
  if (res.status === 404) return null; // nothing stored yet
  if (!res.ok) throw new Error('Pull failed: ' + res.status);
  const json = await res.json();
  return json; // { data: envelope, rev }
}

async function syncNow() {
  const settings = getSyncSettings();
  if (!settings) return;
  setSyncPill('⟳ Syncing…', 'var(--muted)');
  document.getElementById('sync-status-msg').textContent = 'Syncing…';
  try {
    const remote = await pullVault(settings);
    const localRev = parseInt(localStorage.getItem(SYNC_REV_KEY) || '0', 10);

    if (remote && remote.data) {
      const remoteRev = remote.rev || 0;
      if (remoteRev > localRev) {
        // Remote is newer — pull it down
        localStorage.setItem(VAULT_KEY, JSON.stringify(remote.data));
        localStorage.setItem(SYNC_REV_KEY, String(remoteRev));
        // If vault is currently unlocked, re-decrypt with existing key
        if (vaultKey) {
          try {
            const entries = await decryptVault(remote.data, vaultKey);
            data = normaliseEntries(entries);
            renderCount();
            clearSearch();
            showToast('Synced — ' + data.length + ' entries updated');
          } catch (e) {
            // Key doesn't match remote vault — lock and ask for passphrase
            lockVault();
            showToast('Remote vault updated — please unlock again');
          }
        }
        setSyncPill('✓ Synced', '#2a7a4f');
        document.getElementById('sync-status-msg').textContent = 'Pulled remote changes';
      } else {
        // Local is same or newer — push
        await pushVault(settings);
        setSyncPill('✓ Synced', '#2a7a4f');
        document.getElementById('sync-status-msg').textContent = 'Pushed local changes';
      }
    } else {
      // Nothing on remote yet — push local
      await pushVault(settings);
      setSyncPill('✓ Synced', '#2a7a4f');
      document.getElementById('sync-status-msg').textContent = 'Uploaded to cloud';
    }
    setTimeout(() => setSyncPill('⚙ Sync', 'var(--muted)'), 3000);
  } catch (e) {
    setSyncPill('✗ Error', '#c0392b');
    document.getElementById('sync-status-msg').textContent = 'Error: ' + (e.message || e);
    setTimeout(() => setSyncPill('⚙ Sync', 'var(--muted)'), 5000);
  }
}

// ── SERVICE WORKER ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
